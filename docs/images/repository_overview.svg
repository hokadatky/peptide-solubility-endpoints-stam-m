<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 416" width="960" height="416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">What this repository supports</title><desc id="d">Code and records in this repository regenerate all figures and Tables S3, S7 and S8 (Level 1). Adding the SoluProt and NESG data and the ProtT5 and ESM-2 models lets you refit the analyses (Level 3). Per-record predictions are not available (Level 2).</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8794"/></marker></defs><rect width="960" height="416" rx="16" fill="#ffffff"/><rect x="30" y="30" width="360" height="100" rx="12" fill="#e7f3f1" stroke="#2f7f73" stroke-width="1.8"/><text x="50" y="56" font-size="12.5" font-weight="700" fill="#1f5e55" text-anchor="start">IN THIS REPOSITORY</text><text x="50" y="86" font-size="17" font-weight="700" fill="#1c2b3a" text-anchor="start">Code and records</text><text x="50" y="110" font-size="14" font-weight="400" fill="#5b6876" text-anchor="start">aggregates, scripts, run logs</text><rect x="30" y="160" width="360" height="100" rx="12" fill="#fdf3e3" stroke="#b7791f" stroke-width="1.8"/><text x="50" y="186" font-size="12.5" font-weight="700" fill="#8a5a12" text-anchor="start">YOU DOWNLOAD</text><text x="50" y="216" font-size="17" font-weight="700" fill="#1c2b3a" text-anchor="start">Data and models</text><text x="50" y="240" font-size="14" font-weight="400" fill="#5b6876" text-anchor="start">SoluProt/NESG, ProtT5, ESM-2</text><rect x="570" y="30" width="360" height="100" rx="12" fill="#e9eef8" stroke="#3b5b92" stroke-width="1.8"/><text x="590" y="56" font-size="12.5" font-weight="700" fill="#2b4675" text-anchor="start">LEVEL 1</text><text x="590" y="86" font-size="17" font-weight="700" fill="#1c2b3a" text-anchor="start">Regenerate figures</text><text x="590" y="110" font-size="14" font-weight="400" fill="#5b6876" text-anchor="start">all figures, Tables S3, S7, S8</text><rect x="570" y="160" width="360" height="100" rx="12" fill="#e9eef8" stroke="#3b5b92" stroke-width="1.8"/><text x="590" y="186" font-size="12.5" font-weight="700" fill="#2b4675" text-anchor="start">LEVEL 3</text><text x="590" y="216" font-size="17" font-weight="700" fill="#1c2b3a" text-anchor="start">Refit the analyses</text><text x="590" y="240" font-size="14" font-weight="400" fill="#5b6876" text-anchor="start">five stages in level3/</text><rect x="570" y="290" width="360" height="100" rx="12" fill="#f3f4f6" stroke="#9aa3ad" stroke-width="1.8" stroke-dasharray="7 5"/><text x="590" y="316" font-size="12.5" font-weight="700" fill="#6b7480" text-anchor="start">LEVEL 2</text><text x="590" y="346" font-size="17" font-weight="700" fill="#5b6876" text-anchor="start">Not available</text><text x="590" y="370" font-size="14" font-weight="400" fill="#5b6876" text-anchor="start">per-record predictions withheld</text><path d="M390,72 L566,72" fill="none" stroke="#7a8794" stroke-width="2.2" marker-end="url(#ah)"/><path d="M390,100 C480,100 480,200 566,200" fill="none" stroke="#7a8794" stroke-width="2.2" marker-end="url(#ah)"/><path d="M390,218 L566,218" fill="none" stroke="#b7791f" stroke-width="2.2" marker-end="url(#ah)"/><text x="478" y="62" font-size="14" font-weight="700" fill="#5b6876" text-anchor="middle">R + Python</text></svg>
